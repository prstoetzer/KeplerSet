name: Build executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e . -r requirements-build.txt

      - name: Build and test
        run: python scripts/build.py

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\KeplerSet.exe release\KeplerSet-Windows-x64.exe
          Copy-Item dist\KeplerSetCLI.exe release\KeplerSetCLI-Windows-x64.exe
          Get-FileHash release\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release\SHA256SUMS-Windows-x64.txt

      - name: Upload Windows executable bundle
        uses: actions/upload-artifact@v7
        with:
          name: KeplerSet-Windows-x64
          path: release/
          if-no-files-found: error

  macos-arm64:
    name: macOS ARM64
    # GitHub currently documents macos-14 as a standard M1/arm64 runner.
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: arm64
          cache: pip

      - name: Verify native runner
        run: |
          test "$(uname -m)" = "arm64"
          python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"

      - name: Install build dependencies
        run: python -m pip install -e . -r requirements-build.txt

      - name: Build and test
        run: python scripts/build.py

      - name: Verify executable architectures
        run: |
          file dist/KeplerSetCLI
          file dist/KeplerSet.app/Contents/MacOS/KeplerSet
          file dist/KeplerSetCLI | grep -q arm64
          file dist/KeplerSet.app/Contents/MacOS/KeplerSet | grep -q arm64

      - name: Stage macOS artifacts
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/KeplerSet.app release/KeplerSet-macOS-arm64.zip
          cp dist/KeplerSetCLI release/KeplerSetCLI-macOS-arm64
          chmod +x release/KeplerSetCLI-macOS-arm64
          (cd release && shasum -a 256 KeplerSet-macOS-arm64.zip KeplerSetCLI-macOS-arm64 > SHA256SUMS-macOS-arm64.txt)

      - name: Upload macOS ARM64 bundle
        uses: actions/upload-artifact@v7
        with:
          name: KeplerSet-macOS-arm64
          path: release/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: KeplerSet-Windows-x64
          path: artifacts/windows

      - name: Download macOS ARM64 build
        uses: actions/download-artifact@v8
        with:
          name: KeplerSet-macOS-arm64
          path: artifacts/macos

      - name: Stage release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/windows/KeplerSet-Windows-x64.exe release/
          cp artifacts/windows/KeplerSetCLI-Windows-x64.exe release/
          cp artifacts/macos/KeplerSet-macOS-arm64.zip release/
          cp artifacts/macos/KeplerSetCLI-macOS-arm64 release/
          (cd release && sha256sum \
            KeplerSet-Windows-x64.exe \
            KeplerSetCLI-Windows-x64.exe \
            KeplerSet-macOS-arm64.zip \
            KeplerSetCLI-macOS-arm64 > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Publish or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; replacing its binary assets."
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --generate-notes \
              --title "KeplerSet $GITHUB_REF_NAME"
          fi
